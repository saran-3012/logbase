name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all sources
        run: find src scripts tools -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON schema definitions
        run: |
          node -e "
            const t = require('./src/db/schema/tables.json');
            const i = require('./src/db/schema/indexes.json');
            const m = require('./src/db/schema/migrations.json');
            const Adapter = require('./src/db/adapters/libsql');
            const a = Object.create(Adapter.prototype);
            const ddl = a.compileSchema(t, i);
            m.forEach(x => a.compileMigration(x));
            console.log('schema compiles:', ddl.length, 'statements,', m.length, 'migrations');
          "

      # Boots the server against a throwaway local SQLite file and exercises the
      # full ingest path, including a real UDP datagram. Catches schema, routing
      # and listener regressions before they reach Render.
      - name: Boot + ingest smoke test
        env:
          PORT: 3998
          TURSO_DATABASE_URL: file:./ci.db
          JWT_SECRET: ci-only-secret-not-used-in-production
          UDP_ENABLED: 'true'
          UDP_PORT_RANGE: 10000-10010
          UDP_MAX_LISTENERS: '1'
        run: |
          node src/server.js & echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3998/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3998/healthz
          node .github/workflows/smoke.js
          kill "$(cat server.pid)"
