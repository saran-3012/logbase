<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logbase — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">

      <div class="auth-logo">
        <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="20" height="20" rx="6" fill="#C8F135"></rect>
          <path d="M7 8h10M7 12h6M7 16h8" stroke="#0A0C0F" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <h1>Logbase</h1>
        <p>Log ingestion, search and collectors</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button class="active" data-tab="login" type="button" role="tab" aria-selected="true">Sign in</button>
        <button data-tab="register" type="button" role="tab" aria-selected="false">Create account</button>
      </div>

      <div id="auth-notice"></div>

      <!-- Sign in -->
      <form id="login-form" class="auth-form">
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" placeholder="your-username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-accent">Sign in</button>
      </form>

      <!-- Register -->
      <form id="register-form" class="auth-form hidden">
        <div class="field">
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" placeholder="your-username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="at least 8 characters" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="reg-confirm">Confirm password</label>
          <input id="reg-confirm" type="password" placeholder="repeat password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-accent">Create account</button>
      </form>

    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/js/auth.js"></script>
</body>
</html>
