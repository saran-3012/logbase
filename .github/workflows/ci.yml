name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches issues in the scripts themselves before they run.
      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh

      # All pipeline logic lives in scripts/ci.sh, so a local run and a CI run
      # execute exactly the same code: static checks, then the end-to-end suite
      # (HTTP + OAuth + real UDP datagrams against a throwaway SQLite file).
      - name: Run CI pipeline
        run: ./scripts/ci.sh

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/lb-test-server.log
          if-no-files-found: ignore
